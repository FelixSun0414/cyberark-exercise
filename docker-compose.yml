version: "3.8"
services:
  backend:
    command: uvicorn main:app --reload --host 0.0.0.0 --port 5000
    build: ./backend
    working_dir: /app
    #working_dir: ${PWD}/backend
    #volumes:
    #  - "${PWD}/backend:${PWD}/backend"
    ports:
      - "5000:5000"
  frontend:
    build: ./frontend
    working_dir: /app
    #working_dir: ${PWD}/frontend
    #volumes:
    #  - "${PWD}/frontend:${PWD}/frontend"
    ports:
      - "3000:3000"
    depends_on:
      - backend
